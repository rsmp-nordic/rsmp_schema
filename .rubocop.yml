plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'

# Allow longer line lengths for tests with long JSON strings
Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/**/*'

# Allow some reasonable flexibility for domain-specific code
Metrics/MethodLength:
  Max: 25

Metrics/ClassLength:
  Max: 200

Metrics/ModuleLength:
  Max: 300

Metrics/AbcSize:
  Max: 20

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10


# These files contain empty blocks required by the YARD documentation generation.
RSpec/EmptyExampleGroup:
  Enabled: false

# These specs often have multiple expectations to verify the behavior of a feature end-to-end.
RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

# Integration/schema specs describe features, not a specific class
RSpec/DescribeClass:
  Enabled: false

# RSMP signal IDs use uppercase (M0001, A0303, S0007, etc.)
Naming/FileName:
  Enabled: false

# Version strings in let names are meaningful (message_3_1_2 etc.)
Naming/VariableNumber:
  Enabled: false

RSpec/IndexedLet:
  Enabled: false

# frozen string literals is on by default from Ruby 3.4
Style/FrozenStringLiteralComment:
  Enabled: false